# Builds the Astro site (dist/) and deploys it to GitHub Pages: https://schmarante.github.io/rindr/
name: Deploy to GitHub Pages

on:
  # every push to master
  push:
    branches: ["master"]

  # manual run from the Actions tab
  workflow_dispatch:

# GITHUB_TOKEN may deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# only one deployment at a time; queued runs in between are skipped, a running one is not cancelled
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # project page lives in a sub directory (/rindr/): base path and public URL come from the Pages settings
      # (base_path "/rindr", base_url "https://schmarante.github.io/rindr") – astro.config.mjs reads both.
      # Repository variable SITE_URL (Settings → Secrets and variables → Actions → Variables) overrides the URL,
      # e.g. for a custom domain.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ vars.SITE_URL || format('{0}/', steps.pages.outputs.base_url) }}

      # dist/ is the document root of the site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
